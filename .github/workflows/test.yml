name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (svelte-check + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # jsdom (a test-only dependency, for the DOM-touching tests)
          # declares `"engines": {"node": "^22.22.2 || ^24.15.0 || >=26.0.0"}`
          # — Node 20 isn't in that range and fails at import time with
          # `webidl.util.markAsUncloneable is not a function` (a real CI
          # failure this workflow's first run actually hit). 24 matches
          # what's verified working in local dev.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  e2e:
    name: E2E (Playwright, mock backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:e2e
      # `playwright install --with-deps` runs `apt-get update`, which hits
      # Google's Chrome apt repo on the runner image — and that repo has
      # been serving a mismatched `Packages.gz` ("Hash Sum mismatch"),
      # failing the whole job. We only need Playwright's own bundled
      # Chromium (downloaded from Playwright's CDN, not apt); the shared
      # libs it needs are already on the ubuntu-latest runner image. Drop
      # the Chrome apt sources as belt-and-suspenders and skip --with-deps.
      - run: sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          # D2: the reduced-motion / 150% / contrast-theme projects run on pushes to main, not on every PR.
          E2E_MATRIX: ${{ github.event_name == 'push' && '1' || '0' }}
      # §411: tests that only passed on the retry, as warnings (before the perf run rewrites the JSON report).
      - run: node scripts/report-flaky.mjs
        if: ${{ !cancelled() }}
      # D4: performance budgets at real sizes (push to main only)
      - run: npx playwright test --project=perf --workers=1
        if: github.event_name == 'push'
        env:
          PERF: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  e2e-windows-layout:
    name: E2E layout (Windows fonts, 100/125/150%)
    # The Linux run above uses Linux fonts and missed a glyph shift that only showed with Windows fonts at 150% (§379).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --workers=2
        env:
          E2E_WINDOWS_LAYOUT: "1"
      - run: node scripts/report-flaky.mjs
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report-windows-layout
          path: playwright-report/
          retention-days: 14

  build-guard:
    name: Prod build drops the test harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # `src/lib/testing/` is dev-only (import.meta.env.DEV gate in
      # src/main.ts). It must never appear in a production bundle.
      - name: assert no test harness in dist/
        run: |
          if grep -rlE "installMockTauri|__CHRONO_MOCK__|lib/testing" dist/; then
            echo "::error::test harness leaked into the production build"
            exit 1
          fi
          echo "clean — no mock/testing code in dist/"
      # website/webapp/ and website/demo-app/ are committed release
      # artifacts, refreshed only as part of cutting a release (see
      # CLAUDE.local.md's release workflow, step 8) — the same way
      # package.json's version field isn't bumped between releases
      # either. These two builds exist here only to catch a source
      # change that breaks the webapp/demo build outright; they are
      # deliberately NOT diffed against the committed bundles, so an
      # ordinary PR never needs to rebuild-and-commit a bundle just to
      # pass CI.
      - name: webapp bundle still builds
        run: npm run build:webapp
      - name: demo bundle still builds
        run: npm run build:demo

  rust:
    name: Rust (cargo test)
    # Tauri's Windows target needs the MSVC toolchain, which the
    # `windows-latest` GitHub-hosted runner already has preinstalled —
    # matches the only platform this project has actually been built and
    # tested on so far (see CLAUDE.local.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
      # §411: clippy was cleaned up once (13 -> 0 warnings, §381) but nothing kept it there. A new stable Rust can add
      # lints; fixing those is part of keeping this green.
      - name: cargo clippy (warnings are errors)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # `generate_typescript_bindings` (in storage.rs) rewrites
      # `src/lib/generated/tauri-types.ts` from the `#[derive(TS)]` structs.
      # If the checked-in file doesn't match what the Rust types now
      # produce, the frontend is compiling against a stale contract — fail.
      - name: generated TS bindings are up to date
        shell: bash
        run: |
          if ! git diff --exit-code -- src/lib/generated/; then
            echo "::error::src/lib/generated/ is stale — run 'cd src-tauri && cargo test' and commit the result"
            exit 1
          fi
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run notices:check

  native:
    name: Native smoke (real app, Windows)
    # D1: the real debug build driven over WebView2's debugging port. Pushes to main and manual runs only (it builds
    # the whole app, ~10 minutes).
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: npm ci
      - name: debug build of the app with a debugging port (no installer)
        run: |
          node scripts/native-test-config.mjs native-test.conf.json 9333
          npm run tauri build -- --debug --no-bundle --config native-test.conf.json
      - run: npx playwright test -c playwright.native.config.ts
