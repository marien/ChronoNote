name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run weekly on Sundays at 04:00 UTC
    - cron: "0 4 * * 0"

permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run npm audit
        run: npm audit --audit-level=high

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit
      - name: Run cargo audit
        working-directory: src-tauri
        # RUSTSEC-2024-0429 is a Linux-only glib VariantStrIter issue from Tauri's GTK dependencies
        run: cargo audit --ignore RUSTSEC-2024-0429
