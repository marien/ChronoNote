name: Security Audit

# §410: new advisories are published independently of our commits. Run on every push, the audit turned red on every
# unrelated push until the dependency was updated (8 of 14 red runs in mid-October 2026). Now: on pushes and pull
# requests that change dependencies, and daily, so a new advisory shows up once, within a day. The release script runs
# cargo audit before building.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run npm audit
        run: npm audit --audit-level=high

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit
      - name: Run cargo audit
        working-directory: src-tauri
        # RUSTSEC-2024-0429 is a Linux-only glib VariantStrIter issue from Tauri's GTK dependencies
        run: cargo audit --ignore RUSTSEC-2024-0429
