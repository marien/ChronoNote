name: Security Audit

# §410: new advisories are published independently of our commits. Run on every push, the audit turned red on every
# unrelated push until the dependency was updated (8 of 14 red runs in mid-October 2026). Now: on pushes and pull
# requests that change dependencies, and daily, so a new advisory shows up once, within a day. The release script runs
# cargo audit before building.
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # §453: no GitHub token left in .git/config for later steps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run npm audit
        run: npm audit --audit-level=high

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # §453: no GitHub token left in .git/config for later steps
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        working-directory: src-tauri
        # RUSTSEC-2024-0429 is a Linux-only glib VariantStrIter issue from Tauri's GTK dependencies
        run: cargo audit --ignore RUSTSEC-2024-0429
