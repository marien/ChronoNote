<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Live demo · ChronoNote</title>
  <meta name="description" content="Try the real ChronoNote editor in your browser, full screen, on example notes. Nothing is saved and nothing to install." />
  <link rel="canonical" href="https://chrononote.mariendegelder.nl/demo.html" />
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
  <script>try { var t = localStorage.getItem("chrononote-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
  <link rel="icon" href="assets/favicon.ico?v=0.32.7" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=0.32.7" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=0.32.7" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ChronoNote" />
  <meta property="og:url" content="https://chrononote.mariendegelder.nl/demo.html" />
  <meta property="og:title" content="Live demo · ChronoNote" />
  <meta property="og:description" content="The real ChronoNote editor in your browser, on example notes. Nothing is saved." />
  <meta property="og:image" content="https://chrononote.mariendegelder.nl/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="style.css?v=440" />
  <script src="site.js?v=440" defer></script>
</head>
<body class="demo-page">
  <div class="demo-bar">
    <a class="brand" href="./" aria-label="ChronoNote home"><img src="assets/logo.svg" width="20" height="20" alt="" />ChronoNote</a>
    <span>Live demo on example notes. Nothing you do here is saved.</span>
    <nav aria-label="Demo">
      <a href="https://app.chrononote.mariendegelder.nl/" target="_blank" rel="noopener">Use it for real ↗</a>
      <a href="guide.html">Guide</a>
      <div class="theme"></div>
    </nav>
  </div>
  <h1 class="visually-hidden">ChronoNote live demo</h1>
  <iframe id="demoFrame" title="ChronoNote live demo"></iframe>
  <script>
    // demo.html?try=<feature> opens the demo on that feature (see src/lib/testing/demoTry.ts).
    document.addEventListener("DOMContentLoaded", function () {
      var feature = new URLSearchParams(location.search).get("try") || "today";
      window.CN.demo(document.getElementById("demoFrame"), /^[a-z]+$/.test(feature) ? feature : "today");
    });
  </script>
</body>
</html>
