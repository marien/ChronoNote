[package]
name = "chrononote"
version = "0.5.1"
description = "ChronoNote - a minimalist plain-text daily notes and task editor"
edition = "2021"
license = "MIT"

[lib]
name = "chrononote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Atomic note writes (§1.2): temp-file + fsync + rename, with an
# on-drop cleanup guard. `dunce` canonicalizes paths for the
# workspace-confinement check (§1.1) without Windows' `\\?\` prefix.
tempfile = "3"
dunce = "1"
# SHA-256 content hashing for external-modification detection (§2 / §94).
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
