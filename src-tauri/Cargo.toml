[package]
name = "chrononote"
version = "0.2.0"
description = "ChronoNote - a minimalist plain-text daily notes and task editor"
edition = "2021"

[lib]
name = "chrononote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
