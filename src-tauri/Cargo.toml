[package]
name = "chrononote"
version = "0.12.4"
description = "ChronoNote - a minimalist plain-text daily notes and task editor"
edition = "2021"
license = "MIT"

[lib]
name = "chrononote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# GitHub-releases update check (§update-check) — checks a `latest.json`
# manifest, verifies its minisign signature, downloads + installs, then
# `tauri-plugin-process` relaunches. See docs/design/maturity-0.7-roadmap.md.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Atomic note writes (§1.2): temp-file + fsync + rename, with an
# on-drop cleanup guard. `dunce` canonicalizes paths for the
# workspace-confinement check (§1.1) without Windows' `\\?\` prefix.
tempfile = "3"
dunce = "1"
# SHA-256 content hashing for external-modification detection (§2 / §94).
sha2 = "0.10"
# Rust structs are the single source of truth for the Rust<->TS payload
# shapes; a `cargo test` regenerates `src/lib/generated/tauri-types.ts`
# from the `#[derive(TS)]` types (§98). Only the derive macro is used at
# compile time; nothing ts-rs ships in the release binary.
ts-rs = "12"
# OneDrive cloud sync (§2.1-2.3): Microsoft Graph REST API + PKCE auth.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
base64 = "0.23"
rand = "0.8"
tokio = { version = "1", features = ["time", "sync"] }
# The OneDrive refresh token (offline_access + Files.ReadWrite — standing
# access to the whole drive) lives in the OS keychain, never in a plain
# file; "windows-native" since this project is Windows-only so far
# (matches the same choice the parked M365 calendar-import branch made
# for the identical problem).
keyring = { version = "3", features = ["windows-native"] }
# Android OAuth redirect (§2.2): the desktop loopback-listener trick
# (`http://localhost:<port>/auth`) isn't reliable on a real device, since
# Android can suspend or kill the app while the user is off in the system
# browser signing in — a `chrononote://auth` custom-scheme deep link is
# the standard, robust pattern instead. Registered unconditionally (like
# `tauri-plugin-updater` above); only actually configured for mobile in
# `tauri.conf.json`, and desktop's own login flow is untouched.
tauri-plugin-deep-link = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
